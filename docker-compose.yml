# Local development stack. Credentials below are for local use only; real environments take them from
# their own secret store (see docs/02-PROJECT-PLAN.md §2.5).
#
#   docker compose up --build                 full stack → http://demo.localhost:8080
#   docker compose up -d postgres mailpit     dependencies only, when running API/web natively

name: schoolms

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: schoolms
      POSTGRES_USER: schoolms
      POSTGRES_PASSWORD: schoolms_dev
    ports:
      # Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432.
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U schoolms -d schoolms']
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches all outgoing email in development: UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: 'true'
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=schoolms;Username=schoolms;Password=schoolms_dev
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      API_UPSTREAM: api:8080
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      - api

volumes:
  postgres-data:
